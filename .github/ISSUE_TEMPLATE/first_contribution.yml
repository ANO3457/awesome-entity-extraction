name: First contribution or correction
description: Claim a small, bounded improvement or report something that needs fixing.
title: "[Contribution]: "
labels:
  - good-first-issue
body:
  - type: markdown
    attributes:
      value: |
        Thanks for volunteering! Please search existing issues first. Direct PRs are also welcome. Do not include private/customer/health data, credentials, or API keys.
  - type: dropdown
    id: kind
    attributes:
      label: Contribution type
      options:
        - Broken or stale link/description
        - Example documentation or expected output
        - Synthetic edge case + test
        - Field Guide usability feedback
        - Other small scoped fix
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed change
      description: Name the file/section, what you will change, and a quick acceptance check.
      placeholder: "I will update ...; done when ..."
    validations:
      required: true
  - type: checkboxes
    id: safe
    attributes:
      label: Safe contribution
      options:
        - label: I will use only synthetic or redistributable public data and include no secrets.
          required: true
