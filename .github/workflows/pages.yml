name: field-guide-pages

on:
  push:
    branches: [main]
    paths:
      - "field_guide/**"
      - "examples/**/example.json"
      - "scripts/run_field_guide.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/run_field_guide.py validate --runs
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/run_field_guide.py build
      - run: test -s field_guide/site/index.html
      - run: python3 scripts/check-examples.py
      - run: python3 -m compileall -q field_guide scripts tests
      - uses: actions/upload-pages-artifact@v3
        with:
          path: field_guide/site
      - id: deployment
        uses: actions/deploy-pages@v4
