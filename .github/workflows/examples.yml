name: examples

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-examples.py
      - run: python3 -m compileall -q examples scripts
      - run: git diff --check
