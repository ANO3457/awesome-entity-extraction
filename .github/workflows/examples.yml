name: examples

on:
  push:
    branches: [main]
  pull_request:

jobs:
  structure-and-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-examples.py
      - run: python3 scripts/run_field_guide.py validate --runs
      - run: python3 -m unittest discover -s tests -v
      - run: python3 scripts/run_field_guide.py build
      - run: test -s field_guide/site/index.html
      - run: python3 -m compileall -q examples scripts field_guide tests
      - run: git diff --check
