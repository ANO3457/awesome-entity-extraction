name: catalog-freshness

# Monthly: report catalog entries whose last_checked is older than 180 days.
# Kept off the PR path so a calendar rollover never blocks unrelated work.
on:
  schedule:
    - cron: "0 9 1 * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/check-catalog.py --strict
